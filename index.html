<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Todo List</title><script defer="defer" src="main.js"></script></head><body><header><h1>📝 Todo-List</h1></header><div class="blur hidden"></div><div class="edit-overlay hidden"><div class="edit-content"><button class="x">x</button><h1>Edit Todo</h1><div class="input"><label for="task">Task Name</label> <input id="task"></div><div class="input"><label for="due">Due Date</label> <input type="date" id="due"></div><div class="input"><label for="priority">Priority</label> <select name="priority" id="priority"><option value="Low">Low</option><option value="Medium" selected="selected">Medium</option><option value="High">High</option></select></div><div class="input"><label for="description">Description</label> <input id="description"></div><button type="submit" class="done">Done</button></div></div><div class="main-content"><div class="project-section"><div class="side-header-container"><h1>Project List</h1></div><div class="buttons"><button class="add-project">Add Project</button></div></div><main><button class="add-todo">Add Todo</button></main></div></body></html>
